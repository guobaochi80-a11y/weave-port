{{ define "main" }}
<article class="post">
  <h1>{{ .Title }}</h1>
  <div class="meta">{{ .Date.Format "2006-01-02" }}{{ with .Params.section }} · {{ . }}{{ end }}{{ with .Params.penname }} · {{ . }}{{ end }}</div>
  <div class="body">{{ .Content }}</div>
  <nav class="adj">
    {{ with .PrevInSection }}<a href="{{ .RelPermalink }}">← 上一篇</a>{{ end }}
    {{ with .NextInSection }}<a href="{{ .RelPermalink }}">下一篇 →</a>{{ end }}
  </nav>
</article>
{{ end }}
